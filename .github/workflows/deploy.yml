name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Before the build, because a maze fault is a broken level and the build
      # cannot see it: the layout is 42 hand-authored corridors and this exits
      # non-zero on an unreachable corridor, an accidental loop, a junction too
      # narrow to walk through or a wall too thin to stop lamp light. Runs in
      # plain node -- backroomsMaze.js imports nothing from three.
      - run: npm run check:maze
      # Same reasoning one asset over: a malformed maze fails a playthrough,
      # but a malformed creature just renders slightly wrongly forever. The
      # house's monster is the imported Okabe model (creature.glb and its
      # check-creature.mjs gate were removed with it, in ce8157e), and it
      # breaks in its own ways: a material still NAMED for the texture it has
      # lost, a 0x0 MMD toon ramp exporting as nothing, geometry shipped with three
      # vertices per triangle, or every surface left doubleSided. All four of
      # those shipped before this gate existed and all four are valid glTF.
      - run: npm run check:okabe
      # The download: every texture the game ships is meant to be WebP (see
      # scripts/compress-assets.mjs). A model re-exported from Blender comes
      # out with PNGs again -- several megabytes each -- and nothing else would
      # notice. Fails with the files to run `npm run compress:assets` on.
      - run: npm run check:assets
      - run: npm run check:leaderboard
      # Vite embeds these public settings at build time. Local .env is ignored.
      - name: Build with leaderboard configuration
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || { [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ] && [ -z "$VITE_SUPABASE_ANON_KEY" ]; }; then
            echo "::error::Missing leaderboard configuration. Set repository Actions variables VITE_SUPABASE_URL and VITE_SUPABASE_PUBLISHABLE_KEY (or legacy VITE_SUPABASE_ANON_KEY)."
            exit 1
          fi
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
