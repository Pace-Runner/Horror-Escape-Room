<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Don't Let It Out</title>
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <canvas id="scene"></canvas>

  <div id="loading-screen">
    <div id="loading-title">DON'T LET IT OUT</div>
    <div id="loading-bar-track"><div id="loading-bar-fill"></div></div>
    <div id="loading-hint">entering the house...</div>
  </div>

  <div id="crosshair"></div>

  <div id="hud">
    <div id="objective"></div>
    <div id="interact-prompt"></div>
    <div id="flashlight-status">FLASHLIGHT: <span id="flashlight-state">not found</span></div>

    <div id="minimap-wrap">
      <canvas id="minimap"></canvas>
      <div id="minimap-arrow"></div>
    </div>

    <!-- A fixed slot per carryable story item, matching GameState.js's ITEMS
         order. Slots are always present, empty or filled -- toggled by
         refreshInventoryUI() adding/removing the 'filled' class per slot
         rather than by building/tearing down markup. No image assets (see
         the credits screen's own claim to that): every icon below is a
         hand-authored inline SVG. -->
    <!-- Sprint stamina. Sits just above the hotbar and shares its centring, so
         the two read as one block rather than two unrelated overlays. Hidden by
         a class rather than removed, so there is no layout shift when it
         appears -- same approach as the hotbar's own .filled slots. -->
    <div id="stamina"><div id="stamina-fill"></div></div>

    <div id="hotbar">
      <div class="hotbar-slot" data-item="flashlight" title="Flashlight">
        <svg class="hotbar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="9" width="10" height="6" rx="1.5"/>
          <path d="M13 8l5 1.5v5l-5 1.5"/>
          <path d="M20 10l3-1.5M20 14l3 1.5"/>
        </svg>
      </div>
      <div class="hotbar-slot" data-item="crowbar" title="Crowbar">
        <svg class="hotbar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M5 19L16 8"/>
          <path d="M16 8c1-1 1-3-.5-4S12 3 11 4"/>
          <path d="M5 19c-1 1-3 1-4-.5S0 15 1 14"/>
        </svg>
      </div>
      <div class="hotbar-slot" data-item="visor" title="Annabelle's visor">
        <svg class="hotbar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="7" cy="12" r="3.4"/>
          <circle cx="17" cy="12" r="3.4"/>
          <path d="M10.4 12h3.2"/>
          <path d="M3.6 9.5C2.5 9 2 9.7 2 10.5"/>
          <path d="M20.4 9.5c1.1-.5 1.6.2 1.6 1"/>
        </svg>
      </div>
      <div class="hotbar-slot key-brass" data-item="doorKey" title="Desk drawer key">
        <svg class="hotbar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="7" cy="12" r="3.2"/>
          <path d="M10 12h10"/>
          <path d="M16 12v3M19 12v2.5"/>
        </svg>
      </div>
      <div class="hotbar-slot key-steel" data-item="gateKey" title="Gate key">
        <svg class="hotbar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="7" cy="12" r="3.2"/>
          <path d="M10 12h10"/>
          <path d="M16 12v3M19 12v2.5"/>
        </svg>
      </div>
    </div>
  </div>

  <div id="caption-box"></div>

  <!-- Level-transition fade. Not a .hidden toggle: see src/core/ScreenFade.js. -->
  <div id="fade-overlay"></div>

  <div id="start-screen">
    <div id="start-title">DON'T LET IT OUT</div>
    <div id="start-sub">Project HOLLOW &mdash; June 1987</div>
    <button id="start-button">Click to begin</button>
    <button id="restart-button" class="hidden">Restart</button>
    <div id="start-controls">
      WASD move &middot; SHIFT sprint &middot; CTRL crouch &middot; mouse look &middot; E interact &middot; F flashlight &middot; V visor &middot; 1/2/3/4 preview rooms &middot; G skip to exit &middot; R restart &middot; C credits
    </div>
  </div>

  <div id="board-view" class="hidden">
    <div id="board-panel">
      <div id="board-slots">
        <div class="board-slot" data-slot="0"></div>
        <div class="board-slot" data-slot="1"></div>
        <div class="board-slot" data-slot="2"></div>
      </div>
      <div id="board-tray"></div>
      <button id="board-close">Close</button>
    </div>
  </div>

  <div id="pinpad-view" class="hidden">
    <div id="pinpad-panel">
      <div id="pinpad-display"></div>
      <div id="pinpad-grid">
        <button class="pinpad-key" data-digit="1">1</button>
        <button class="pinpad-key" data-digit="2">2</button>
        <button class="pinpad-key" data-digit="3">3</button>
        <button class="pinpad-key" data-digit="4">4</button>
        <button class="pinpad-key" data-digit="5">5</button>
        <button class="pinpad-key" data-digit="6">6</button>
        <button class="pinpad-key" data-digit="7">7</button>
        <button class="pinpad-key" data-digit="8">8</button>
        <button class="pinpad-key" data-digit="9">9</button>
        <button id="pinpad-clear" class="pinpad-key pinpad-wide">Clear</button>
        <button class="pinpad-key" data-digit="0">0</button>
        <button id="pinpad-close" class="pinpad-key pinpad-wide">Close</button>
      </div>
    </div>
  </div>

  <!-- Long-form reading surface: letters, notes, files, tape transcripts.
       Generic on purpose; see src/core/DocumentUI.js. -->
  <div id="document-view" class="hidden">
    <div id="document-panel" class="document-note">
      <h2 id="document-title"></h2>
      <div id="document-body"></div>
      <button id="document-close">Put it down</button>
    </div>
    <div id="document-hint">there is more below</div>
  </div>

  <div id="credits-screen" class="hidden">
    <div id="credits-panel">
      <h2>Credits</h2>
      <ul id="credits-list"></ul>
      <button id="credits-close">Close</button>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
